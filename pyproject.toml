[project]
name = "ws-verlag"
version = "0.1.0"
description = "Individualsoftware fuer Verlagskunde: Kunden-, Artikel-, Auftrags-, Rechnungs- und Mahnwesen"
authors = [{ name = "Gerhard Weidlinger", email = "g.weidlinger@gmail.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "alembic (>=1.13.0,<2.0.0)",
    "pymysql (>=1.1.0,<2.0.0)",
    "cryptography (>=42.0.0,<44.0.0)",
    "jinja2 (>=3.1.0,<4.0.0)",
    "python-multipart (>=0.0.9,<1.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (==4.0.1)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "pydantic-settings (>=2.4.0,<3.0.0)",
    "reportlab (>=4.2.0,<5.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
