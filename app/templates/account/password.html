{% extends "base.html" %}
{% block title %}Passwort ändern - WS-Verlag Verwaltung{% endblock %}
{% block content %}
<h1>Passwort &auml;ndern</h1>
<div class="card" style="max-width: 480px;">
  {% if success %}
  <p role="status">Passwort erfolgreich ge&auml;ndert.</p>
  {% endif %}
  {% if error %}
  <p class="error-message" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/account/password">
    <label for="current_password">Aktuelles Passwort</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>

    <label for="new_password">Neues Passwort</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>

    <label for="new_password_confirm">Neues Passwort best&auml;tigen</label>
    <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" minlength="8" required>

    <p><button type="submit" style="margin-top: 1rem;">Passwort &auml;ndern</button></p>
  </form>
</div>
{% endblock %}
