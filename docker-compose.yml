# Deployment fuer Synology NAS (Container Manager). Vor dem ersten Start:
#   1. .env aus .env.example anlegen und Werte setzen (SECRET_KEY unbedingt!).
#   2. `docker compose up -d` im Synology Container Manager oder per SSH.
# Details und Sicherheitshinweise: siehe README-DEPLOYMENT.md.
#
# Test-Suite (laeuft NUR bei explizitem Aufruf, nicht bei `docker compose up -d`):
#   docker compose --profile test run --rm test
# Baut den `test`-Stage aus dem Dockerfile und fuehrt pytest gegen eine eigene
# Wegwerf-MariaDB (db-test) aus; --rm entfernt den Test-Container nach dem Lauf.

services:
  app:
    image: ${WS_VERLAG_IMAGE:-ws-verlag-app:local}
    container_name: ws-verlag-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://ws_verlag:${MARIADB_PASSWORD}@mariadb:3306/ws_verlag
      # Gemeinsames Secret mit dem Updater-Container: sichert /updates/report gegen
      #Manipulation durch andere LAN-Teilnehmer ab (siehe app/routers/updates.py).
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      # Beschreibbar: die App schreibt hierher update_request.json/backup_request.json/
      # restore_request.json (siehe app/routers/updates.py, app/routers/help.py) und liest
      # restore_status.json, das der Updater-Container zurueckschreibt.
      - update_signal:/update-signal
      - ./backups:/backups:ro
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - ws-verlag-net
    # Bewusst KEIN Zugriff auf /var/run/docker.sock - siehe updater-Kommentar unten.

  mariadb:
    image: mariadb:11
    container_name: ws-verlag-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ws_verlag
      MARIADB_USER: ws_verlag
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ws-verlag-net

  # Einziger Container mit Docker-Socket-Zugriff (= faktisch Root-Rechte auf dem NAS-Host).
  # Fuehrt Backup, Image-Pull, Container-Austausch und Rollback fuer den Update-Mechanismus
  # aus - siehe app/routers/updates.py und updater/updater.py. Bewusst kein Port-Publish.
  # Legt ausserdem die regelmaessige, taegliche Datenbank-Sicherung an (BACKUP_INTERVAL_HOURS)
  # und behaelt davon nur die juengsten BACKUP_RETENTION_COUNT Dateien.
  updater:
    build: ./updater
    container_name: ws-verlag-updater
    restart: unless-stopped
    environment:
      APP_CONTAINER_NAME: ws-verlag-app
      HEALTHCHECK_URL: http://ws-verlag-app:8000/healthz
      REPORT_URL: http://ws-verlag-app:8000/updates/report
      UPDATE_SIGNAL_DIR: /update-signal
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: "24"
      BACKUP_RETENTION_COUNT: "14"
      MARIADB_CONTAINER_NAME: ws-verlag-db
      MARIADB_DATABASE: ws_verlag
      MARIADB_USER: root
      MARIADB_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      # GitHub Personal Access Token (Scope: read:packages) fuer den Image-Pull beim Update -
      # ein "docker login" auf dem Host reicht nicht, siehe Kommentar in updater/updater.py.
      GHCR_USERNAME: ${GHCR_USERNAME:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      # Muss zum app-seitigen UPDATER_TOKEN passen (Header X-Updater-Token).
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - update_signal:/update-signal
      - ./backups:/backups
    networks:
      - ws-verlag-net

  # ---- Test-Profile (nur mit `--profile test` aktiv, laeuft NICHT bei `up -d`) ----
  db-test:
    profiles: ["test"]
    image: mariadb:11
    container_name: ws-verlag-dbtest
    # Kein volume -> Zustandslose Wegwerf-DB, beim naechsten Lauf wieder leer.
    environment:
      MARIADB_DATABASE: ws_verlag_test
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ws-verlag-net

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    container_name: ws-verlag-test
    # Keine Ports/Volumes/Socket - fuehrt nur pytest aus und beendet sich danach.
    environment:
      TEST_DATABASE_URL: mysql+pymysql://root@db-test:3306/ws_verlag_test
      DATABASE_URL: mysql+pymysql://root@db-test:3306/ws_verlag_test
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - ws-verlag-net

networks:
  ws-verlag-net:
    driver: bridge

volumes:
  mariadb_data:
  update_signal:
