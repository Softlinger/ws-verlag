{% extends "base.html" %}
{% block title %}Neuer Auftrag - WS-Verlag Verwaltung{% endblock %}
{% block content %}
<h1>Neuer Auftrag</h1>
<div class="card">
  <form method="post" action="/orders/new">
    <label for="customer_id">Kunde</label>
    <select id="customer_id" name="customer_id" required>
      {% for customer in customers %}
      <option value="{{ customer.id }}">{{ customer.name }}</option>
      {% endfor %}
    </select>

    <label for="order_date">Auftragsdatum</label>
    <input id="order_date" name="order_date" type="date" required value="{{ '' }}">

    <label for="advertising_tax_applicable">
      <input id="advertising_tax_applicable" name="advertising_tax_applicable" type="checkbox" style="width:auto; display:inline-block;">
      Werbesteuer (5%) zuordnen
    </label>

    <label for="note">Notiz</label>
    <textarea id="note" name="note" rows="2"></textarea>

    <h2>Positionen</h2>
    <table id="items-table">
      <thead><tr><th scope="col">Artikel</th><th scope="col">Bezeichnung</th><th scope="col">Menge</th><th scope="col">Einzelpreis</th><th scope="col">MwSt.</th></tr></thead>
      <tbody>
        <tr>
          <td>
            <select name="article_id">
              <option value="">-</option>
              {% for article in articles %}
              <option value="{{ article.id }}" data-name="{{ article.name }}" data-price="{{ article.unit_price }}" data-vat="{{ article.vat_rate }}">{{ article.name }}</option>
              {% endfor %}
            </select>
          </td>
          <td><input name="description"></td>
          <td><input name="quantity" type="number" step="0.01" value="1" data-default="1"></td>
          <td><input name="unit_price" type="number" step="0.01" value="0.00" data-default="0.00"></td>
          <td>
            <select name="vat_rate">
              <option value="10">10%</option>
              <option value="20" selected>20%</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
    <p><button type="button" id="add-item-row" class="secondary">+ Position hinzuf&uuml;gen</button></p>

    <p><button type="submit">Auftrag anlegen</button> <a class="btn secondary" href="/orders">Abbrechen</a></p>
  </form>
</div>
{% include "partials/line_items_script.html" %}
{% endblock %}
