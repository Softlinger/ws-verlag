{% extends "base.html" %}
{% block title %}Anmeldung - WS-Verlag Verwaltung{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 3rem auto;">
  <h1>Anmeldung</h1>
  {% if error %}<p class="error-message" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="username">Benutzername</label>
    <input id="username" name="username" type="text" autocomplete="username" required>

    <label for="password">Passwort</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <p><button type="submit" style="margin-top: 1rem;">Anmelden</button></p>
  </form>
</div>
{% endblock %}
