{% extends "base.html" %}
{% block title %}Neue Gutschrift - WS-Verlag Verwaltung{% endblock %}
{% block content %}
<h1>Neue Gutschrift</h1>
<div class="card">
  <form method="post" action="/credit-notes/new">
    <label for="invoice_id">Rechnung</label>
    <select id="invoice_id" name="invoice_id" required>
      {% for inv in invoices %}
      <option value="{{ inv.id }}" {{ "selected" if invoice and invoice.id == inv.id else "" }}>{{ inv.number }} - {{ inv.customer.name }}</option>
      {% endfor %}
    </select>

    <label for="credit_note_date">Datum</label>
    <input id="credit_note_date" name="credit_note_date" type="date" required>

    <label for="reason">Grund</label>
    <input id="reason" name="reason">

    <h2>Positionen</h2>
    <table id="items-table">
      <thead><tr><th scope="col">Bezeichnung</th><th scope="col">Menge</th><th scope="col">Einzelpreis</th><th scope="col">MwSt.</th></tr></thead>
      <tbody>
        <tr>
          <td><textarea name="description" rows="2"></textarea></td>
          <td><input name="quantity" type="number" step="0.01" value="1" data-default="1"></td>
          <td><input name="unit_price" type="number" step="0.01" value="0.00" data-default="0.00"></td>
          <td>
            <select name="vat_rate">
              <option value="10">10%</option>
              <option value="20" selected>20%</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
    <p><button type="button" id="add-item-row" class="secondary">+ Position hinzuf&uuml;gen</button></p>

    <p><button type="submit">Gutschrift anlegen</button> <a class="btn secondary" href="/credit-notes">Abbrechen</a></p>
  </form>
</div>
{% include "partials/line_items_script.html" %}
{% endblock %}
